[package]
name = "example-db-pool"
description = "Database section for the cgp-config multi-crate example. Depends on the facade with derive only and does not link std IO."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cgp-config = { workspace = true, features = ["derive"] }
cgp-fork = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }

