[package]
name                 = "cgp-config-formats"
description          = "Document formats for cgp-config: TOML and JSON parsers with spans, duplicate-key rejection, and load limits, plus renderers. `no_std` + `alloc`."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
authors.workspace      = true
keywords.workspace     = true
categories.workspace   = true
readme               = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["toml"]
# TOML 1.1 (the `toml` crate's spanned document parser and its writer).
toml = ["dep:toml"]
# JSON (RFC 8259) through this crate's own spanned, duplicate-rejecting parser.
json = []
# Keeps TOML tables in source order (`toml/preserve_order` needs `std`).
std = ["cgp-config-value/std", "toml?/std", "toml?/preserve_order"]

[dependencies]
cgp-config-core  = { workspace = true, features = ["alloc"] }
cgp-config-value = { workspace = true }
cgp-fork         = { workspace = true, features = ["alloc"] }
serde_json       = { workspace = true }
toml             = { workspace = true, optional = true }

[dev-dependencies]
cgp-fork = { workspace = true, features = ["alloc", "anyhow"] }
proptest = { workspace = true }

[lints]
workspace = true
