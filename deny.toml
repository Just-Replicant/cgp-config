# cargo-deny configuration. Run with `cargo deny --workspace check` (or `cargo xtask deny`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only for dependencies; the published workspace crates are AGPL
# (unpublished ones such as xtask are skipped by `private.ignore`).
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "cgp-config" },
    { allow = ["AGPL-3.0-or-later"], crate = "cgp-config-core" },
    { allow = ["AGPL-3.0-or-later"], crate = "cgp-config-value" },
    { allow = ["AGPL-3.0-or-later"], crate = "cgp-config-secrets" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
